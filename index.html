<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গণতন্ত্র ও নির্বাচন - MCQ Quiz Game</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #2980b9;
            --success: #27ae60;
            --error: #c0392b;
            --bg: #f4f6f7;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'SolaimanLipi', 'Kalpurush', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: var(--secondary);
            margin-bottom: 20px;
            font-size: 24px;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: #7f8c8d;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .question-box {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #34495e;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }
        .option-item {
            background: #fdfefe;
            border: 2px solid #bdc3c7;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
        }
        .option-item:hover:not(.disabled) {
            background: #ebf5fb;
            border-color: var(--secondary);
        }
        .option-item.correct {
            background: #d4efdf !important;
            border-color: var(--success) !important;
            color: #145a32;
        }
        .option-item.wrong {
            background: #ffadad !important;
            border-color: var(--error) !important;
            color: #78281f;
        }
        .option-item.disabled {
            cursor: not-allowed;
        }
        .btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1f618d;
        }
        .score-card {
            text-align: center;
            display: none;
        }
        .score-card h2 {
            color: var(--success);
            font-size: 28px;
        }
        .score-details {
            font-size: 18px;
            margin: 20px 0;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div class="container" id="game-container">
    <h1>অধ্যায় ০৮: বাংলাদেশের গণতন্ত্র ও নির্বাচন</h1>
    
    <div id="quiz-screen">

            <span id="question-count">প্রশ্ন ১ / ৩৫</span>
            <span id="score-tracker">সঠিক: ০ | ভুল: ০</span>
        </div>
        <div class="question-box" id="question-text">প্রশ্ন লোড হচ্ছে...</div>
        <ul class="options-list" id="options-list"></ul>
        <button class="btn" id="next-btn" style="display:none;" onclick="nextQuestion()">পরবর্তী প্রশ্ন</button>
    </div>

    <div class="score-card" id="score-card">
        <h2>কুইজ সমাপ্ত!</h2>
        <div class="score-details" id="score-details"></div>
        <button class="btn" onclick="restartQuiz()">পুনরায় খেলুন</button>
    </div>
</div>

            options: ["প্রত্যক্ষ", "পরোক্ষ", "নিরপেক্ষ", "গণভোট"],

            options: ["আইন বিভাগ", "নির্বাহী বিভাগ", "বিচার বিভাগ", "সামরিক বাহিনী"],

            options: ["i ও ii", "i ও iii", "ii ও iii", "i, ii ও iii"],
            answer: 2
        },
        {
            question: "১০৭৪. প্রিজাইডিং/পোলিং অফিসার সংক্রান্ত উদ্দীপক—",
            options: ["i ও ii", "ii ও iii", "i ও iii", "i, ii ও iii"],
            answer: 1
        },
        {
            question: "১০৭৫. নির্বাচনি আইন লঙ্ঘনকারী বিষয় হলো—",
            options: ["i ও ii", "i ও iii", "ii ও iii", "i, ii ও iii"],
            answer: 0
        }
    ];

    let currentIdx = 0;
    let scoreCorrect = 0;
    let scoreWrong = 0;
    let answered = false;

    const questionText = document.getElementById("question-text");
    const optionsList = document.getElementById("options-list");
    const nextBtn = document.getElementById("next-btn");
    const questionCount = document.getElementById("question-count");
    const scoreTracker = document.getElementById("score-tracker");
    const quizScreen = document.getElementById("quiz-screen");
    const scoreCard = document.getElementById("score-card");
    const scoreDetails = document.getElementById("score-details");

    function loadQuestion() {
        answered = false;
        nextBtn.style.display = "none";
        const q = quizData[currentIdx];
        questionText.innerText = q.question;
        questionCount.innerText = `প্রশ্ন ${currentIdx + 1} / ${quizData.length}`;
        scoreTracker.innerText = `সঠিক: ${scoreCorrect} | ভুল: ${scoreWrong}`;
        
        optionsList.innerHTML = "";
        q.options.forEach((opt, idx) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerText = opt;
            li.onclick = () => selectOption(idx, li);
            optionsList.appendChild(li);
        });
    }

    function selectOption(selectedIdx, element) {
        if (answered) return;
        answered = true;

        const q = quizData[currentIdx];
        const options = optionsList.children;

        if (selectedIdx === q.answer) {
            element.classList.add("correct");
            scoreCorrect++;
        } else {
            element.classList.add("wrong");
            options[q.answer].classList.add("correct");
            scoreWrong++;
        }

        for (let li of options) {
            li.classList.add("disabled");
        }

        scoreTracker.innerText = `সঠিক: ${scoreCorrect} | ভুল: ${scoreWrong}`;
        
        if (currentIdx < quizData.length - 1) {
            nextBtn.style.display = "block";
        } else {
            setTimeout(showScore, 1000);
        }
    }

    function nextQuestion() {
        currentIdx++;
        loadQuestion();
    }

    function showScore() {
        quizScreen.style.display = "none";
        scoreCard.style.display = "block";
        const total = quizData.length;
        const percentage = ((scoreCorrect / total) * 100).toFixed(2);
        
        scoreDetails.innerHTML = `
            মোট প্রশ্ন: <b>${total}</b> টি<br>
            সঠিক উত্তর: <b style="color: #27ae60;">${scoreCorrect}</b> টি<br>
            ভুল উত্তর: <b style="color: #c0392b;">${scoreWrong}</b> টি<br>
            সফলতার হার (Percentage): <b style="color: #2980b9;">${percentage}%</b>
        `;
    }

    function restartQuiz() {
        currentIdx = 0;
        scoreCorrect = 0;
        scoreWrong = 0;
        quizScreen.style.display = "block";
        scoreCard.style.display = "none";
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
